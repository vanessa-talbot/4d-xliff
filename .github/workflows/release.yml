name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Check the release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          const lock = require('./package-lock.json');
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} must match package.json version v${version}`);
          }
          if (lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('package-lock.json version must match package.json');
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package the extension
        run: npm run package -- --out "$RUNNER_TEMP/4d-xliff-${RELEASE_VERSION}.vsix"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/4d-xliff-${RELEASE_VERSION}.vsix" \
            "${args[@]}"
